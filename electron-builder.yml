appId: com.satiscorp.satisdocs
productName: SatisDocs

directories:
  output: dist

files:
  - "main/**/*"
  - "renderer/**/*"
  - "docs/**/*"
  - "assets/**/*"

win:
  target: nsis

linux:
  target: AppImage

mac:
  target: dmg

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SatisDocs